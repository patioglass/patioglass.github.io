name: Fetch Works Data from GAS API

on:
  # 毎日午前9時(JST)に実行 (UTC 0:00)
  schedule:
    - cron: '0 0 * * *'
  # 手動実行も可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Fetch Works data from GAS API
        env:
          GAS_API_URL: ${{ secrets.GAS_API_URL }}
        run: |
          mkdir -p public/data

          # APIからデータ取得
          HTTP_CODE=$(curl -L -s -w "%{http_code}" -o public/data/works.json "$GAS_API_URL")

          # HTTPステータスコードチェック
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Error: API returned HTTP $HTTP_CODE"
            exit 1
          fi

          # JSONとして有効かチェック
          if ! jq empty public/data/works.json 2>/dev/null; then
            echo "Error: Invalid JSON response"
            cat public/data/works.json
            exit 1
          fi

          # 配列かつ空でないかチェック
          LENGTH=$(jq 'length' public/data/works.json)
          if [ "$LENGTH" -eq 0 ]; then
            echo "Error: Empty array returned"
            exit 1
          fi

          echo "Successfully fetched $LENGTH works"

      - name: Install webp tools
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Fetch Images from GAS API
        env:
          GAS_API_URL: ${{ secrets.GAS_API_URL }}
        run: |
          mkdir -p public/images
          mkdir -p /tmp/original_images

          # Secret にクエリ文字列が含まれていても action を正しく追加する
          case "$GAS_API_URL" in
            *\?*) IMAGES_API_URL="${GAS_API_URL}&action=images" ;;
            *)    IMAGES_API_URL="${GAS_API_URL}?action=images" ;;
          esac

          # 画像APIからデータ取得
          HTTP_CODE=$(curl -L -sS -w "%{http_code}" -o /tmp/images.json "$IMAGES_API_URL")

          # HTTPステータスコードチェック
          if [ "$HTTP_CODE" -eq 404 ]; then
            # 画像APIが未公開でも、コミット済み画像が揃っていれば更新を続行できる
            echo "Warning: Images API returned HTTP 404; using committed images"
          elif [ "$HTTP_CODE" -ne 200 ]; then
            echo "Error: Images API returned HTTP $HTTP_CODE"
            exit 1
          else
            # JSONとして有効かチェック
            if ! jq -e 'type == "array"' /tmp/images.json >/dev/null 2>&1; then
              echo "Error: Invalid JSON response from images API"
              cat /tmp/images.json
              exit 1
            fi

            # 画像の数を取得
            IMAGE_COUNT=$(jq 'length' /tmp/images.json)
            echo "Found $IMAGE_COUNT images"

            # 各画像をbase64デコードしてwebpに変換
            for i in $(seq 0 $((IMAGE_COUNT - 1))); do
              [ "$IMAGE_COUNT" -eq 0 ] && break
              FILE_NAME=$(jq -r ".[$i].name" /tmp/images.json)
              MIME_TYPE=$(jq -r ".[$i].mimeType" /tmp/images.json)
              BASE64_DATA=$(jq -r ".[$i].data" /tmp/images.json)

              # mimeTypeから元の拡張子を決定
              case "$MIME_TYPE" in
                "image/webp") EXT="webp" ;;
                "image/jpeg") EXT="jpg" ;;
                "image/png") EXT="png" ;;
                "image/gif") EXT="gif" ;;
                *) EXT="bin" ;;
              esac

              TEMP_FILE="/tmp/original_images/${FILE_NAME}.${EXT}"
              OUTPUT_FILE="public/images/${FILE_NAME}.webp"

              # base64デコードして一時ファイルに保存
              echo "$BASE64_DATA" | base64 -d > "$TEMP_FILE"

              # webpに変換（既にwebpの場合はコピー）
              if [ "$MIME_TYPE" = "image/webp" ]; then
                cp "$TEMP_FILE" "$OUTPUT_FILE"
              else
                cwebp -q 80 "$TEMP_FILE" -o "$OUTPUT_FILE"
              fi

              echo "Converted and saved: $OUTPUT_FILE"
            done

            echo "Successfully converted and saved $IMAGE_COUNT images as webp"
          fi

          # APIを利用できない場合も含め、全作品の画像が揃っていることを保証する
          MISSING_IMAGES=0
          while IFS= read -r FILE_NAME; do
            if [ ! -f "public/images/${FILE_NAME}.webp" ]; then
              echo "Error: Missing image for Drive file: $FILE_NAME"
              MISSING_IMAGES=$((MISSING_IMAGES + 1))
            fi
          done < <(jq -r '.[].imageUrl // empty | capture("[?&]id=(?<id>[^&]+)").id' public/data/works.json)

          if [ "$MISSING_IMAGES" -ne 0 ]; then
            echo "Error: $MISSING_IMAGES referenced image(s) are unavailable"
            exit 1
          fi

      - name: Check if data changed
        id: check_changes
        run: |
          git add public/data/works.json
          git add public/images/
          if git diff --staged --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "🔄 Update works data and images from GAS API"
          git push
